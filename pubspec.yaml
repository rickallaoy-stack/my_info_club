name: club_informatique_app
description: Plateforme du Club Informatique — section Développement Mobile (V1 pilote)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - asset/
